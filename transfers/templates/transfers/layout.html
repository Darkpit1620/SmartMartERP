{% extends 'core/base.html' %}
{% load static %}
{% block content %}
<div class="dashboard-area transfer-area"><div class="wrap">
  <div class="breadcrumbs"><a href="{% url 'core:dashboard' %}">My workspace</a><span>›</span><a href="{% url 'transfers:list' %}">Branch transfers</a></div>

  {% block transfer_content %}{% endblock %}
</div></div>
{% endblock %}
